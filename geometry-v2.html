<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F9F8F6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23A85D6B' stroke-width='2'/%3E%3Cpath d='M16 3 A13 13 0 0 1 29 16 L16 16 Z' fill='%23A85D6B'/%3E%3C/svg%3E">
  <title>I — V · Celestial Atlas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap');

    :root {
      --background: #07070F;
      --foreground: #E8E4F0;
      --muted-foreground: #8B86A0;
      --border: #2A2740;
      --card: #0D0D1A;
      --primary: #F2C14E; /* celestial gold */
    }

    .font-serif-arch { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-mono-arch { font-family: 'IBM Plex Mono', monospace; }

    /* Subtle cotton paper grain via SVG noise filter */
    .paper-surface {
      background-color: var(--background);
      position: relative;
    }

    /* Cotton paper grain overlay (fixed, non-interactive) */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      background-image:
        radial-gradient(1px 1px at 12% 22%, rgba(232,228,240,0.8), transparent 100%),
        radial-gradient(1px 1px at 33% 9%, rgba(232,228,240,0.5), transparent 100%),
        radial-gradient(1.4px 1.4px at 51% 28%, rgba(242,193,78,0.8), transparent 100%),
        radial-gradient(1px 1px at 68% 14%, rgba(232,228,240,0.6), transparent 100%),
        radial-gradient(1px 1px at 84% 31%, rgba(232,228,240,0.45), transparent 100%),
        radial-gradient(1.2px 1.2px at 21% 62%, rgba(232,228,240,0.5), transparent 100%),
        radial-gradient(1px 1px at 42% 78%, rgba(127,212,230,0.6), transparent 100%),
        radial-gradient(1px 1px at 61% 66%, rgba(232,228,240,0.5), transparent 100%),
        radial-gradient(1.3px 1.3px at 78% 74%, rgba(242,193,78,0.7), transparent 100%),
        radial-gradient(1px 1px at 90% 52%, rgba(232,228,240,0.5), transparent 100%),
        radial-gradient(1px 1px at 8% 86%, rgba(232,228,240,0.45), transparent 100%),
        radial-gradient(1px 1px at 29% 93%, rgba(232,228,240,0.4), transparent 100%),
        radial-gradient(1.1px 1.1px at 55% 92%, rgba(127,212,230,0.55), transparent 100%),
        radial-gradient(1px 1px at 73% 90%, rgba(232,228,240,0.4), transparent 100%);
      background-repeat: no-repeat;
    }

    body {
      background-color: var(--background);
      background-image:
        radial-gradient(ellipse 130% 80% at 18% -12%, rgba(242,193,78,0.08), transparent 55%),
        radial-gradient(ellipse 120% 90% at 82% 112%, rgba(127,212,230,0.07), transparent 55%),
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(130,90,180,0.07), transparent 70%);
    }

    ::selection {
      background: #A85D6B;
      color: #1A1A1A;
    }

    /* Visible keyboard focus ring (quiet, on-theme) */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .hairline { border: 1px solid var(--border); }
    .hairline-t { border-top: 1px solid var(--border); }
    .hairline-b { border-bottom: 1px solid var(--border); }

    /* Blind emboss seal dynamic lighting */
    #embossSeal {
      transition: transform 0.2s ease-out, box-shadow 0.15s ease-out;
    }

    /* Optical Loupe Styling */
    #opticalLoupe {
      pointer-events: none;
      width: 240px;
      height: 240px;
      border-radius: 9999px;
      position: absolute;
      overflow: hidden;
      z-index: 40;
      box-shadow: 
        0 12px 32px -4px rgba(0, 0, 0, 0.22),
        inset 0 0 18px rgba(0, 0, 0, 0.12);
      border: 1.5px solid var(--foreground);
      background-color: var(--card);
      transform: translate(-50%, -50%) scale(0.95);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #opticalLoupe.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Tracing paper (Calque) amber/blueprint tint */
    .calque-active #plateStage {
      background-image: 
        linear-gradient(to right, rgba(232, 228, 240, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(232, 228, 240, 0.06) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Backlight (Light table) effect */
    .backlight-active #plateStage {
      box-shadow: inset 0 0 90px rgba(180, 180, 160, 0.18);
    }

    /* Smooth fade transitions between plates */
    .plate-fade {
      animation: fadePlate 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadePlate {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Subtle pulse on cover seal */
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.06); opacity: 0.65; }
    }
    .pulse-ring {
      animation: breathe 5s ease-in-out infinite;
      transform-origin: center;
    }

    /* Reduced motion: calm the instrument down */
    @media (prefers-reduced-motion: reduce) {
      .pulse-ring {
        animation: none;
      }
      .plate-fade {
        animation: none;
      }
    }

    /* Print: architectural plates at full detail, no chrome */
    @media print {
      header,
      #footerControls,
      #coverView,
      body::after {
        display: none !important;
      }
      #plateStage {
        width: 100% !important;
        max-width: 100% !important;
        border: none !important;
        box-shadow: none !important;
      }
      .micro-layer,
      .calque-layer {
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body class="paper-surface text-[var(--foreground)] antialiased min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

  <!-- ===================================================================== -->
  <!-- VIEW 0: THE THRESHOLD (BLIND-EMBOSSED MONOLITH COVER)                 -->
  <!-- ===================================================================== -->
  <section id="coverView" class="fixed inset-0 z-50 bg-[var(--background)] flex flex-col justify-between p-8 sm:p-14 transition-opacity duration-700">
    
    <!-- Top Corner Crop Marks -->
    <div class="flex justify-between items-start text-[var(--muted-foreground)] opacity-40 font-mono-arch text-xs">
      <span>⌜</span>
      <span class="tracking-widest">+0.00</span>
      <span>⌝</span>
    </div>

    <!-- Center Blind-Embossed Architectural Glyph -->
    <div class="my-auto flex flex-col items-center justify-center">
      <button id="enterAtelierBtn" onclick="enterGallery()" class="group relative p-12 rounded-full cursor-pointer" aria-label="Enter Portfolio">
        
        <!-- Embossed Paper Medallion -->
        <div id="embossSeal" class="w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-[var(--background)] hairline flex items-center justify-center relative">
          
          <svg viewBox="0 0 200 200" class="w-44 h-44 text-[var(--foreground)] overflow-visible">
            <!-- Outer subtle compass ring (appears on hover) -->
            <circle cx="100" cy="100" r="84" fill="none" stroke="currentColor" stroke-width="0.4" stroke-dasharray="1 4" class="opacity-20 group-hover:opacity-70 transition-opacity duration-500" />
            <circle cx="100" cy="100" r="72" fill="none" stroke="currentColor" stroke-width="0.3" class="pulse-ring" />

            <!-- Registration ticks -->
            <line x1="100" y1="8" x2="100" y2="18" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.4" />
            <line x1="100" y1="182" x2="100" y2="192" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.4" />
            <line x1="8" y1="100" x2="18" y2="100" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.4" />
            <line x1="182" y1="100" x2="192" y2="100" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.4" />

            <!-- Horizon Datum Line -->
            <line x1="32" y1="100" x2="168" y2="100" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.45" />

            <!-- The Two Points (Teacher & Learner) -->
            <circle cx="62" cy="100" r="2.2" fill="currentColor" />
            <circle cx="138" cy="100" r="2.2" fill="currentColor" />

            <!-- Faint Pentimenti Catenary Curves (Ghost attempts) -->
            <path d="M 62 100 Q 100 118 138 100" fill="none" stroke="currentColor" stroke-width="0.35" stroke-dasharray="2 2" stroke-opacity="0.25" />
            <path d="M 62 100 Q 100 132 138 100" fill="none" stroke="currentColor" stroke-width="0.35" stroke-dasharray="1 3" stroke-opacity="0.2" />

            <!-- Primary Resonance Arch & Catenary Tension Chord -->
            <path d="M 62 100 C 62 55, 138 55, 138 100" fill="none" stroke="currentColor" stroke-width="0.9" class="group-hover:stroke-[var(--primary)] transition-colors duration-500" />
            <path d="M 62 100 Q 100 146 138 100" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.6" />

            <!-- Vertical Plumb Line & Datum Triangle (∇) -->
            <line x1="100" y1="42" x2="100" y2="136" stroke="currentColor" stroke-width="0.45" stroke-dasharray="2 2" stroke-opacity="0.5" />
            <polygon points="100,100 96,93 104,93" fill="none" stroke="currentColor" stroke-width="0.7" />
            
            <!-- Golden Spiral Micro-detail at Center (visible on close inspection) -->
            <circle cx="100" cy="66" r="1.2" fill="var(--primary)" class="opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
          </svg>

        </div>

        <!-- Subtle Roman Numeral Sequence below seal -->
        <div class="mt-8 text-center font-mono-arch text-xs tracking-[0.35em] text-[var(--muted-foreground)] opacity-50 group-hover:opacity-100 transition-opacity">
          I · II · III · IV · V
        </div>

        <!-- Whisper-line beneath the sequence -->
        <div class="mt-3 text-center font-serif-arch italic text-sm text-[var(--muted-foreground)] opacity-60 group-hover:opacity-100 transition-opacity">
          Teaching lives in unrepeatable moments.
        </div>

        <!-- Architect-of-learning tagline beneath the whisper line -->
        <div class="mt-2 text-center font-mono-arch text-[10.5px] tracking-[0.28em] text-[var(--muted-foreground)] opacity-[0.55] group-hover:opacity-100 transition-opacity">
          AN ARCHITECT OF LEARNING — CELESTIAL ATLAS · PLATES I–V
        </div>
      </button>
    </div>

    <!-- Bottom Corner Crop Marks -->
    <div class="flex justify-between items-end text-[var(--muted-foreground)] opacity-40 font-mono-arch text-xs">
      <span>⌞</span>
      <span class="tracking-widest">◯</span>
      <span>⌟</span>
    </div>
  </section>


  <!-- ===================================================================== -->
  <!-- VIEW 1: THE LIGHT TABLE EXHIBITION (PLATES I — IV)                    -->
  <!-- ===================================================================== -->
  
  <!-- Minimalist Top Datum Bar (Symbols & Numerals Only) -->
  <header class="px-6 sm:px-12 py-4 flex flex-wrap justify-between items-center gap-x-4 gap-y-2 font-mono-arch text-xs text-[var(--muted-foreground)] hairline-b">
    <div class="flex items-center gap-3">
      <button onclick="returnToCover()" class="hover:text-[var(--foreground)] transition-colors px-2 py-1" title="Threshold">
        ⌜ ∇ ⌟
      </button>
      <span class="opacity-30">|</span>
      <span id="plateCoord" class="tracking-widest text-[var(--foreground)]">I / IV</span>
    </div>

    <!-- Plate Selector Numerals -->
    <nav class="flex items-center gap-2 sm:gap-4">
      <button onclick="selectPlate(0)" id="nav-0" class="plate-tab px-3 py-1 transition-all text-[var(--foreground)] font-medium border-b border-[var(--foreground)]" aria-current="true" title="Nothing to Explore">I</button>
      <button onclick="selectPlate(1)" id="nav-1" class="plate-tab px-3 py-1 transition-all opacity-40 hover:opacity-100" title="The Recoil">II</button>
      <button onclick="selectPlate(2)" id="nav-2" class="plate-tab px-3 py-1 transition-all opacity-40 hover:opacity-100" title="The Return">III</button>
      <button onclick="selectPlate(3)" id="nav-3" class="plate-tab px-3 py-1 transition-all opacity-40 hover:opacity-100" title="Out and About">IV</button>
      <button onclick="selectPlate(4)" id="nav-4" class="plate-tab px-3 py-1 transition-all opacity-40 hover:opacity-100" title="The Choice">V</button>
    </nav>

    <!-- Scale & Compass Bearing -->
    <div class="hidden sm:flex items-center gap-4 tracking-widest opacity-60">
      <span id="plateAzimuth">N 14° E</span>
      <span>·</span>
      <span id="plateScale">1 : 20</span>
    </div>
  </header>


  <!-- CENTER EXHIBITION STAGE -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 sm:px-10 py-6">
    
    <!-- Matted Architectural Sheet -->
    <div id="plateStage" role="img" aria-label="Plate I — Nothing to Explore, ink drawing" class="w-full max-w-5xl aspect-[4/5] sm:aspect-[16/10] bg-[var(--card)] hairline relative overflow-hidden shadow-sm cursor-none select-none">
      
      <!-- Corner Sheet Crop Ticks -->
      <div class="absolute top-3 left-3 text-xs font-mono-arch opacity-25 pointer-events-none">⌜</div>
      <div class="absolute top-3 right-3 text-xs font-mono-arch opacity-25 pointer-events-none">⌝</div>
      <div class="absolute bottom-3 left-3 text-xs font-mono-arch opacity-25 pointer-events-none">⌞</div>
      <div class="absolute bottom-3 right-3 text-xs font-mono-arch opacity-25 pointer-events-none">⌟</div>

      <!-- PRIMARY SVG ARTWORK CONTAINER (1x Macro View) -->
      <div id="macroContainer" class="w-full h-full flex items-center justify-center p-4 sm:p-8 plate-fade">
        <!-- Injected dynamically from plate templates -->
      </div>

      <!-- THE OPTICAL LOUPE (3.5x Magnifier revealing Hidden Micro-Layer & Pentimenti) -->
      <div id="opticalLoupe">
        <div id="loupeInner" class="w-full h-full relative origin-top-left">
          <!-- High-res magnified SVG clone injected here -->
        </div>
        <!-- Optical Loupe Reticle & Degree Bezel Overlay -->
        <svg viewBox="0 0 240 240" class="absolute inset-0 w-full h-full pointer-events-none text-[var(--foreground)]">
          <!-- Subtle glass vignette -->
          <circle cx="120" cy="120" r="118" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.3" />
          <!-- Degree ticks around bezel -->
          <line x1="120" y1="0" x2="120" y2="8" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5" />
          <line x1="120" y1="232" x2="120" y2="240" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5" />
          <line x1="0" y1="120" x2="8" y2="120" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5" />
          <line x1="232" y1="120" x2="240" y2="120" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5" />
          <!-- Center optical crosshair -->
          <line x1="114" y1="120" x2="126" y2="120" stroke="var(--primary)" stroke-width="0.5" stroke-opacity="0.6" />
          <line x1="120" y1="114" x2="120" y2="126" stroke="var(--primary)" stroke-width="0.5" stroke-opacity="0.6" />
          <circle cx="120" cy="120" r="24" fill="none" stroke="var(--primary)" stroke-width="0.35" stroke-dasharray="1 2" stroke-opacity="0.5" />
          <text x="128" y="18" font-family="monospace" font-size="8" fill="currentColor" opacity="0.5">3.5×</text>
        </svg>
      </div>

    </div>

    <!-- SUBTLE ARCHITECTURAL FOOTER CONTROLS (SYMBOLS ONLY) -->
    <div id="footerControls" class="w-full max-w-5xl mt-4 flex justify-between items-center font-mono-arch text-xs text-[var(--muted-foreground)]">
      
      <!-- Left: Plate Title, Datum & Time Stamp Symbol -->
      <div class="flex items-center gap-3 sm:gap-4 opacity-70">
        <span id="plateTitle" class="font-serif-arch italic text-sm text-[var(--muted-foreground)]">I. Nothing to Explore</span>
        <span class="opacity-30">·</span>
        <span id="plateDatum">∇ +0.00</span>
        <span>·</span>
        <span id="plateHour">07:45</span>
      </div>

      <!-- Center: Layer Inspection Toggles (Loupe, Calque Tracing Paper, Backlight) -->
      <div class="flex items-center gap-3">
        <!-- Loupe Toggle -->
        <button id="btnLoupe" onclick="toggleLoupeMode()" aria-pressed="true" class="hairline px-3 py-1.5 flex items-center gap-2 bg-[var(--card)] text-[var(--foreground)] transition-all" title="Optical Loupe (3.5x)">
          <span class="text-[var(--primary)]">◯</span>
          <span>3.5×</span>
        </button>

        <!-- Calque (Tracing Paper Geometry) Toggle -->
        <button id="btnCalque" onclick="toggleCalqueMode()" aria-pressed="false" class="hairline px-3 py-1.5 flex items-center gap-2 opacity-50 hover:opacity-100 transition-all" title="Calque / Tracing Paper Vectors">
          <span>⧉</span>
          <span>A—A'</span>
        </button>

        <!-- Backlight (Pentimenti X-Ray) Toggle -->
        <button id="btnBacklight" onclick="toggleBacklightMode()" aria-pressed="false" class="hairline px-3 py-1.5 flex items-center gap-2 opacity-50 hover:opacity-100 transition-all" title="Light Table (Pentimenti)">
          <span>☀</span>
          <span>±</span>
        </button>
      </div>

      <!-- Right: Next/Prev Plate Arrows -->
      <div class="flex items-center gap-3">
        <button onclick="stepPlate(-1)" class="hairline px-2.5 py-1 hover:bg-[var(--card)] hover:text-[var(--foreground)] transition-colors">←</button>
        <button onclick="stepPlate(1)" class="hairline px-2.5 py-1 hover:bg-[var(--card)] hover:text-[var(--foreground)] transition-colors">→</button>
      </div>
    </div>

  </main>

  <!--   2. .micro-layer (Faint at 1x, razor-sharp inside 3.5x Loupe)        -->
  <!--   3. .calque-layer (Hidden unless in Loupe or Calque A-A' mode)       -->
  <!-- ===================================================================== -->
  <div class="hidden">

    <!-- =================================================================== -->

            <path d="M 696 338 L 692 400 M 714 338 L 718 400"/>
          </g>
          <text x="150" y="120" font-family="IBM Plex Mono, monospace" font-size="5" fill="currentColor" stroke="none">16:45</text>
          <path d="M 292 484 C 370 470, 440 470, 540 484 C 640 470, 700 470, 760 484" fill="none" stroke-width="0.3" stroke-dasharray="3 2" opacity="0.6"/>
        </g>
        <!-- CALQUE -->
        <g class="calque-layer transition-opacity duration-500" opacity="0.0">
          <g stroke="var(--primary)" fill="none" stroke-width="0.35" stroke-dasharray="2 3" opacity="0.6">
            <text x="150" y="52" font-family="IBM Plex Mono, monospace" font-size="8" fill="var(--primary)" stroke="none">ORBITAL GRID</text>
            <ellipse cx="833" cy="360" rx="120" ry="180" stroke-opacity="0.5"/>
            <ellipse cx="292" cy="430" rx="90" ry="50" stroke-opacity="0.5"/>
            <line x1="292" y1="436" x2="760" y2="436" stroke-width="0.7" stroke-dasharray="6 3" marker-end="url(#p5-arrow)"/>
            <line x1="150" y1="522" x2="850" y2="522" stroke-width="0.5" stroke-dasharray="7 3 2 3" marker-end="url(#p5-arrow)"/>
            <text x="500" y="536" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="var(--primary)" stroke="none">t₀ → t₂</text>
          </g>
        </g>
        </svg>
    </template>

  </div>


  <!-- ===================================================================== -->
  <!-- INTERACTIVE CONTROLLER (Blind Emboss Lighting, 3.5x Loupe, Overlays)  -->
  <!-- ===================================================================== -->
  <script>
    const platesMeta = [
      { coord: 'I / V',    azimuth: 'N 14° E',  scale: '1 : 20', datum: '∇ +0.00', hour: '07:45', title: 'Nothing to Explore' },
      { coord: 'II / V',   azimuth: 'N 14° E',  scale: '1 : 5',  datum: '∇ +0.45', hour: '10:05', title: 'The Recoil' },
      { coord: 'III / V',  azimuth: 'N 00° E',  scale: '1 : 10', datum: '∇ −0.20 → +1.00', hour: '15:00 ⇢ 15:00', title: 'The Return' },
      { coord: 'IV / V',   azimuth: 'S 40° W',  scale: '1 : 50', datum: '∇ +2.40', hour: '13:10', title: 'Out and About' },
      { coord: 'V / V',    azimuth: 'N 90° E',  scale: '1 : 10', datum: '∇ +0.00 → +1.68', hour: '16:45 ⇢ 17:30', title: 'The Choice' }
    ];

    let currentPlate = 0;
    let loupeEnabled = true;
    let calqueEnabled = false;
    let backlightEnabled = false;

    const coverView = document.getElementById('coverView');
    const embossSeal = document.getElementById('embossSeal');
    const plateStage = document.getElementById('plateStage');
    const macroContainer = document.getElementById('macroContainer');
    const opticalLoupe = document.getElementById('opticalLoupe');
    const loupeInner = document.getElementById('loupeInner');
    const ZOOM = 3.5;
    const touchOnly = window.matchMedia('(hover: none)').matches;

    // Hash routing: '#/II' or '#/2' → 0-based plate index; '#/' (or empty) → cover
    function plateFromHash() {
      const raw = (location.hash || '').replace(/^#\/?/, '');
      if (!raw) return null;
      const numerals = { I: 0, II: 1, III: 2, IV: 3, V: 4 };
      if (Object.prototype.hasOwnProperty.call(numerals, raw.toUpperCase())) {
        return numerals[raw.toUpperCase()];
      }
      const n = parseInt(raw, 10);
      if (!isNaN(n) && n >= 1 && n <= 5) return n - 1;
      return null;
    }

    function hideCoverInstant() {
      coverView.style.transition = 'none';
      coverView.style.opacity = '0';
      coverView.style.pointerEvents = 'none';
      void coverView.offsetHeight;
      coverView.style.transition = '';
    }

    // 1. Dynamic Directional Lighting on the Cover Blind-Embossed Seal
    coverView.addEventListener('mousemove', (e) => {
      const rect = embossSeal.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = (e.clientX - centerX) / (window.innerWidth / 2);
      const dy = (e.clientY - centerY) / (window.innerHeight / 2);

      const shadowX = (-dx * 14).toFixed(1);
      const shadowY = (-dy * 14).toFixed(1);
      embossSeal.style.boxShadow = `
        ${shadowX}px ${shadowY}px 28px rgba(0, 0, 0, 0.09),
        ${-shadowX}px ${-shadowY}px 28px rgba(255, 255, 255, 0.06),
        inset ${shadowX * 0.4}px ${shadowY * 0.4}px 12px rgba(0, 0, 0, 0.04)
      `;
    });

    function enterGallery() {
      coverView.style.opacity = '0';
      coverView.style.pointerEvents = 'none';
      renderPlate(currentPlate);
    }

    function returnToCover() {
      coverView.style.opacity = '1';
      coverView.style.pointerEvents = 'auto';
      try { history.replaceState(null, '', '#/'); } catch (e) {}
    }

    // 2. Render Selected Plate into Macro Canvas & High-Res Loupe Clone
    function renderPlate(idx) {
      currentPlate = idx;
      const tpl = document.getElementById(`tpl-plate-${idx}`);
      if (!tpl) return;

      // Re-trigger fade animation
      macroContainer.classList.remove('plate-fade');
      void macroContainer.offsetWidth;
      macroContainer.classList.add('plate-fade');

      // Populate Macro View
      macroContainer.innerHTML = tpl.innerHTML;
      // Populate Magnified Loupe View
      loupeInner.innerHTML = tpl.innerHTML;

      //Inside the Loupe, always reveal the Microscopic Pentimenti & Calque Geometry in full clarity!
      const loupeMicro = loupeInner.querySelector('.micro-layer');
      const loupeCalque = loupeInner.querySelector('.calque-layer');
      if (loupeMicro) loupeMicro.setAttribute('opacity', '1');
      if (loupeCalque) loupeCalque.setAttribute('opacity', '0.85');

      // Sync Macro Overlays based on active toggles
      syncMacroLayers();

      // Update Metadata Coordinates
      const meta = platesMeta[idx];
      const numeral = meta.coord.split(' ')[0];
      document.getElementById('plateCoord').innerText = meta.coord;
      document.getElementById('plateAzimuth').innerText = meta.azimuth;
      document.getElementById('plateScale').innerText = meta.scale;
      document.getElementById('plateDatum').innerText = meta.datum;
      document.getElementById('plateHour').innerText = meta.hour;
      document.getElementById('plateTitle').innerText = `${numeral}. ${meta.title}`;

      // Surface plate identity in the document title, stage label, and URL hash
      document.title = `${numeral} — ${meta.title} · I – IV`;
      plateStage.setAttribute('aria-label', `Plate ${numeral} — ${meta.title}, ink drawing`);
      try { history.replaceState(null, '', '#' + '/' + numeral); } catch (e) {}

      // Update Roman Numeral Tabs
      document.querySelectorAll('.plate-tab').forEach((tab, i) => {
        if (i === idx) {
          tab.className = 'plate-tab px-3 py-1 transition-all text-[var(--foreground)] font-medium border-b border-[var(--foreground)]';
          tab.setAttribute('aria-current', 'true');
        } else {
          tab.className = 'plate-tab px-3 py-1 transition-all opacity-40 hover:opacity-100';
          tab.removeAttribute('aria-current');
        }
      });
    }

    function selectPlate(idx) {
      renderPlate(idx);
    }

    function stepPlate(dir) {
      const next = (currentPlate + dir + 5) % 5;
      renderPlate(next);
    }

    // 3. Optical Loupe Tracking & 3.5x Magnification Math
    function updateLoupe(clientX, clientY) {
      if (!loupeEnabled) return;
      const rect = plateStage.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      opticalLoupe.classList.add('active');
      opticalLoupe.style.left = `${x}px`;
      opticalLoupe.style.top = `${y}px`;

      // Position and scale the inner clone so the exact point (x, y) is centered in the 240x240 loupe
      const loupeRadius = 120;
      loupeInner.style.width = `${rect.width}px`;
      loupeInner.style.height = `${rect.height}px`;
      loupeInner.style.transform = `translate(${loupeRadius - x * ZOOM}px, ${loupeRadius - y * ZOOM}px) scale(${ZOOM})`;
    }

    plateStage.addEventListener('mousemove', (e) => updateLoupe(e.clientX, e.clientY));

    plateStage.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) updateLoupe(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    plateStage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateLoupe(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    plateStage.addEventListener('mouseleave', () => {
      opticalLoupe.classList.remove('active');
    });

    plateStage.addEventListener('touchend', () => {
      opticalLoupe.classList.remove('active');
    });

    // 4. Layer Inspection Toggles (Loupe, Calque A-A', Backlight)
    function syncMacroLayers() {
      const macroMicro = macroContainer.querySelector('.micro-layer');
      const macroCalque = macroContainer.querySelector('.calque-layer');

      if (macroCalque) {
        macroCalque.setAttribute('opacity', calqueEnabled ? '0.95' : '0.16');
      }
      if (macroMicro) {
        macroMicro.setAttribute('opacity', backlightEnabled ? '0.95' : '0.45');
      }

      document.body.classList.toggle('calque-active', calqueEnabled);
      document.body.classList.toggle('backlight-active', backlightEnabled);
      plateStage.style.cursor = touchOnly ? 'default' : (loupeEnabled ? 'none' : 'crosshair');
    }

    function toggleLoupeMode() {
      loupeEnabled = !loupeEnabled;
      const btn = document.getElementById('btnLoupe');
      if (!loupeEnabled) {
        opticalLoupe.classList.remove('active');
        btn.classList.add('opacity-50');
        btn.classList.remove('bg-[var(--card)]', 'text-[var(--foreground)]');
      } else {
        btn.classList.remove('opacity-50');
        btn.classList.add('bg-[var(--card)]', 'text-[var(--foreground)]');
      }
      btn.setAttribute('aria-pressed', String(loupeEnabled));
      syncMacroLayers();
    }

    function toggleCalqueMode() {
      calqueEnabled = !calqueEnabled;
      const btn = document.getElementById('btnCalque');
      btn.classList.toggle('opacity-50', !calqueEnabled);
      btn.classList.toggle('bg-[var(--card)]', calqueEnabled);
      btn.classList.toggle('text-[var(--primary)]', calqueEnabled);
      btn.setAttribute('aria-pressed', String(calqueEnabled));
      syncMacroLayers();
    }

    function toggleBacklightMode() {
      backlightEnabled = !backlightEnabled;
      const btn = document.getElementById('btnBacklight');
      btn.classList.toggle('opacity-50', !backlightEnabled);
      btn.classList.toggle('bg-[var(--card)]', backlightEnabled);
      btn.classList.toggle('text-[var(--foreground)]', backlightEnabled);
      btn.setAttribute('aria-pressed', String(backlightEnabled));
      syncMacroLayers();
    }

    // Keyboard navigation (Left/Right arrows, Space for Calque)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') stepPlate(1);
      if (e.key === 'ArrowLeft') stepPlate(-1);
    });

    // Respond to hash changes (browser back/forward, manual URL edits)
    window.addEventListener('hashchange', () => {
      const idx = plateFromHash();
      if (idx === null) {
        returnToCover();
      } else if (idx !== currentPlate) {
        hideCoverInstant();
        renderPlate(idx);
      }
    });

    // Initialize: honor a plate hash (#/II or #/2); otherwise keep the cover
    const initialIdx = plateFromHash();
    if (initialIdx !== null) {
      hideCoverInstant();
      renderPlate(initialIdx);
    } else {
      renderPlate(0);
    }
  </script>
</body>
