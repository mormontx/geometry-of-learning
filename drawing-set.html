<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">
<style>
/* Layout: an architect's drawing set for learning. Each sheet is a real sheet: a sectional drawing
   with a title strip on its right edge; a magnifier reads the fine print; general notes sit below. */
:root{
  --page:#e6e1d0; --bar:#ded8c5; --sheet:#f4f0e2; --ink:#2b2618; --mut:#6c6450; --faint:#b9b096; --rule:#cfc7ae;
  --accent:#6a5cb0; --hair:#cf621c; --mark:#b2463f; --tear:#5b8fc4;
  --f-ui:Jost,"Futura","Century Gothic",system-ui,sans-serif;
  --f-hand:"Architects Daughter","Bradley Hand","Segoe Print",cursive;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1d1b14; --bar:#18160f; --sheet:#241f0c; --ink:#e9e2c8; --mut:#958d74; --faint:#4f4935; --rule:#3a3524;
  --accent:#c9b8f0; --hair:#ee8a46; --mark:#d0645f; --tear:#8fc3ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1d1b14; --bar:#18160f; --sheet:#241f0c; --ink:#e9e2c8; --mut:#958d74; --faint:#4f4935; --rule:#3a3524;
  --accent:#c9b8f0; --hair:#ee8a46; --mark:#d0645f; --tear:#8fc3ef; color-scheme:dark}

body{background:var(--page);color:var(--ink);font:300 1rem/1.6 var(--f-ui)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1200px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--mark);outline-offset:3px}
.lbl{display:block;font:400 .66rem/1.3 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}

/* sheet bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.top{background:var(--bar);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:12px}
.mark{display:flex;align-items:center;gap:14px;font-size:.8rem;letter-spacing:.14em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mark b{font-weight:400;color:var(--mut);letter-spacing:.2em}
.tabs{display:flex;gap:2px}
.tabs button{min-width:40px;padding:8px 10px;font-size:.78rem;letter-spacing:.14em;color:var(--mut);border:1px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--mark);box-shadow:inset 0 -1px 0 var(--ink)}
.meta{justify-self:end;font-size:.74rem;letter-spacing:.18em;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase}

/* the sheet */
.stage{padding-block:clamp(20px,4vh,44px) 0}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--sheet);border:1px solid var(--mut);outline:1px solid var(--rule);outline-offset:5px}
.drawing{position:relative;border-right:1px solid var(--mut);touch-action:none;min-width:0;display:flex;align-items:center}
.drawing svg{display:block;width:100%;height:auto;cursor:crosshair}
.drawing svg.lensing{cursor:none}
.strip{display:flex;flex-direction:column;min-width:0}
.cell{padding:14px 16px;border-bottom:1px solid var(--rule)}
.cell:last-child{border-bottom:0}
.proj b{display:block;font:400 1.02rem/1.25 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.proj i{display:block;font-size:.86rem;color:var(--mut);margin-top:2px}
.detail{flex:1;min-height:9em;display:flex;flex-direction:column;gap:6px}
.detail .k{font:500 .7rem/1 var(--f-ui);letter-spacing:.18em;color:var(--mark)}
.detail h2{margin:0;font:400 1.04rem/1.3 var(--f-ui)}
.detail p{margin:0;font-size:.92rem;line-height:1.5;color:var(--mut)}
.dl{list-style:none;margin:6px 0 0;padding:0;display:grid}
.dl button{display:flex;gap:10px;width:100%;text-align:left;padding:3px 0;font-size:.86rem;color:var(--mut)}
.dl button b{font-weight:500;color:var(--mark);font-size:.7rem;letter-spacing:.12em;min-width:2.2em;padding-top:2px}
.dl button:hover,.dl button[aria-current="true"]{color:var(--ink)}
.data{display:grid;grid-template-columns:1fr 1fr;padding:0}
.data>div{padding:9px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.data>div:nth-child(2n){border-right:0}
.data .v{font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.data .no{grid-column:1/-1;border-bottom:0;border-right:0;display:flex;align-items:end;justify-content:space-between;gap:10px}
.data .no .v{font:300 2.1rem/1 var(--f-ui);letter-spacing:.04em}
.data .no small{font-size:.78rem;color:var(--mut);text-align:right}

/* svg vocabulary (no svg prefix: these also style the magnifier's <use> copy) */
.s{fill:none;stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.s.f{stroke:var(--faint)}.s.m{stroke:var(--mut)}.s.dash{stroke-dasharray:3 5}
.s.grid{stroke:var(--faint);stroke-dasharray:14 4 2 4;stroke-width:.8}
.s.prop{stroke:var(--mut);stroke-dasharray:18 4 3 4 3 4}
.cut{fill:url(#hatch);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.earth{fill:url(#earth);stroke:none}
.hl{stroke:var(--faint);stroke-width:.9}
.head-t,.bow{fill:var(--accent);stroke:none}
.hair{fill:none;stroke:var(--hair);stroke-linecap:round}
.bo{fill:var(--ink);stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.bf{stroke:var(--sheet);stroke-linecap:round}.bfp{fill:var(--sheet);stroke:none}.bft{fill:var(--accent);stroke:none}
.shoe{fill:var(--ink)}.bd{fill:none;stroke:var(--ink);stroke-linecap:round}.bd.f{stroke:var(--mut)}.bdot,.eye{fill:var(--ink)}
.cap{fill:var(--ink)}.capt{fill:var(--ink);opacity:.55}.tear{fill:var(--tear)}
.drawin .fig{animation:fade 1s .5s both}
.tx{font:400 12px var(--f-hand);fill:var(--mut)}
.tx.ink{fill:var(--ink)}
.lt{font:400 11px var(--f-ui);letter-spacing:.18em;fill:var(--mut)}
.lt.big{font-size:13px;fill:var(--ink)}
.cover-t{font:300 46px var(--f-ui);letter-spacing:.01em;fill:var(--ink)}
.bub{font:400 10px var(--f-ui);fill:var(--mut)}
.tiny{font:400 3.3px var(--f-hand);fill:var(--ink)}
.tiny.r{fill:var(--mark)}
.dim{stroke:var(--mark);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.dimt{font:400 11px var(--f-hand);fill:var(--mark)}
.pin{fill:none;stroke:var(--mark);stroke-width:1;vector-effect:non-scaling-stroke}
.pin.on{stroke-width:2}
.pinhit{fill:transparent;cursor:pointer}
.ring{fill:none;stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ring.halo{stroke:var(--sheet);stroke-width:5}
.ring.f{stroke:var(--mut);stroke-width:.8}
.ringt{font:400 9px var(--f-ui);fill:var(--ink);letter-spacing:.08em}
.lensbg{fill:var(--sheet)}
.tag{font:500 7px var(--f-ui);letter-spacing:.16em;fill:var(--mark)}
.marching{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1);opacity:0}}
.rotor{transform-box:fill-box;transform-origin:center;animation:rotor .25s linear infinite}
@keyframes rotor{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
.drawin .s:not(.dash):not(.grid):not(.prop){stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}}

/* caption bar */
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 16px;margin-top:6px;border-bottom:1px solid var(--rule)}
.cap h1{margin:0;font:italic 300 1.2rem/1.2 var(--f-ui);letter-spacing:.02em}
.cap .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--mut);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tools button,.arrows button{border:1px solid var(--rule);padding:7px 13px;font-size:.8rem;letter-spacing:.06em;color:var(--mut);display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tools button[aria-pressed="true"]{color:var(--ink);border-color:var(--mut);background:var(--bar)}
.tools button:hover,.arrows button:hover{color:var(--ink);border-color:var(--mut)}
.arrows{display:flex;gap:8px}
.arrows button{padding:7px 15px;font-size:1rem}

/* general notes */
.notes{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;border:1px solid var(--rule);border-top:0;margin-bottom:48px}
.notes>div{padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.notes>div+div{border-left:1px solid var(--rule)}
.note{font:400 1.14rem/1.55 var(--f-hand);margin:0;max-width:62ch}
.kq{margin:0;font-style:italic;font-size:1.1rem;line-height:1.5}
.how{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:.95rem;color:var(--mut)}
.how b{font-weight:400;color:var(--ink)}
.idx{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.idx td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.idx td:first-child{width:4.6em;color:var(--mark);font-size:.8rem;letter-spacing:.08em;padding-top:9px}
.idx td:last-child{text-align:right;color:var(--mut);white-space:nowrap;padding-left:10px}
.idx button{text-align:left}
.idx button:hover{text-decoration:underline}
footer{border-top:1px solid var(--rule);padding-block:20px 40px;font-size:.88rem;color:var(--mut)}
footer .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
footer a{color:var(--ink)}

@media(max-width:940px){
  .sheet{grid-template-columns:minmax(0,1fr)}
  .drawing{border-right:0;border-bottom:1px solid var(--mut)}
  .strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .strip .proj{grid-column:1/-1}.strip .detail{min-height:0;border-right:1px solid var(--rule)}
  .strip .data{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr))}
  .data>div,.data>div:nth-child(2n){border-right:1px solid var(--rule)}
  .data .no{grid-column:auto;grid-row:span 2;display:block}.data .no small{display:block;text-align:left;margin-top:6px}
  .notes{grid-template-columns:minmax(0,1fr)}.notes>div+div{border-left:0;border-top:1px solid var(--rule)}
  .top .in{grid-template-columns:auto 1fr}.meta{display:none}.tabs{justify-self:end}
  .tools{margin-left:0}
}
@media(max-width:560px){
  .mark span{display:none}.tabs button{min-width:0;padding:7px 7px}
  .strip{grid-template-columns:minmax(0,1fr)}.strip .detail{border-right:0}
  .strip .data{grid-template-columns:1fr 1fr}.data .no{grid-column:1/-1;grid-row:auto;display:flex}.data .no small{text-align:right;margin:0}
  .data>div:nth-child(2n){border-right:1px solid var(--rule)}.data>div:nth-child(2n+1){border-right:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.drawin .s{stroke-dasharray:none!important}}
</style>

<script>
/* ---------- drawing vocabulary ---------- */
const R1=n=>Math.round(n*10)/10;
const L=(a,b,c,d,k='')=>`<line class="s ${k}" x1="${R1(a)}" y1="${R1(b)}" x2="${R1(c)}" y2="${R1(d)}"/>`;
const Ci=(x,y,r,k='')=>`<circle class="s ${k}" cx="${R1(x)}" cy="${R1(y)}" r="${R1(r)}"/>`;
const Pa=(d,k='')=>`<path class="s ${k}" d="${d}"/>`;
const Re=(x,y,w,h,k='')=>`<rect class="s ${k}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const Tx=(x,y,s,k='tx',a='start')=>`<text class="${k}" x="${R1(x)}" y="${R1(y)}" text-anchor="${a}">${s}</text>`;
const arrow=(x1,y1,x2,y2,k='')=>{const a=Math.atan2(y2-y1,x2-x1),h=7;return L(x1,y1,x2,y2,k)+Pa(`M${R1(x2-h*Math.cos(a-.45))} ${R1(y2-h*Math.sin(a-.45))}L${x2} ${y2}L${R1(x2-h*Math.cos(a+.45))} ${R1(y2-h*Math.sin(a+.45))}`,k)};

/* scale figures (architects call them entourage). Joints are in body-heights: u across (+ = facing side), v up from the ground */
const BASE={hd:[0,.935],nk:[0,.85],sL:[-.085,.82],sR:[.085,.82],wL:[-.058,.6],wR:[.058,.6],pL:[-.068,.47],pR:[.068,.47],
  hipL:[-.036,.46],hipR:[.036,.46],eL:[-.1,.64],hL:[-.094,.47],eR:[.1,.64],hR:[.094,.47],kL:[-.042,.26],aL:[-.048,.035],kR:[.042,.26],aR:[.048,.035]};
const POSES={
  stand:{},
  clasp:{eL:[-.09,.64],hL:[.01,.55],eR:[.09,.64],hR:[.02,.56]},
  reach:{eL:[.11,.72],hL:[.25,.73],eR:[.15,.75],hR:[.29,.78]},
  point:{eR:[.15,.93],hR:[.25,1.03],eL:[-.08,.64],hL:[-.04,.48]},
  raise:{eL:[-.12,.98],hL:[-.075,1.12],eR:[.12,.98],hR:[.075,1.12]},
  cheer:{eR:[.13,.97],hR:[.16,1.1],eL:[-.1,.64],hL:[-.09,.47]},
  hold:{eR:[.1,.63],hR:[.2,.69],eL:[-.01,.61],hL:[.16,.66]},
  carry:{eR:[.1,.63],hR:[.13,.48],eL:[-.07,.64],hL:[-.02,.5],hd:[.03,.92]},
  walk:{kL:[-.06,.26],aL:[-.13,.035],kR:[.1,.27],aR:[.15,.035],eL:[-.06,.64],hL:[-.12,.5],eR:[.08,.64],hR:[.14,.5]},
  run:{hd:[.06,.925],nk:[.05,.84],sL:[-.03,.81],sR:[.12,.81],wL:[-.03,.6],wR:[.09,.6],kR:[.17,.33],aR:[.12,.1],kL:[-.07,.24],aL:[-.2,.12],
    eR:[.18,.68],hR:[.25,.79],eL:[-.06,.66],hL:[-.14,.56]},
  sit:{hd:[.03,.665],nk:[.02,.585],sL:[-.07,.55],sR:[.1,.55],wL:[-.055,.37],wR:[.065,.37],pL:[-.065,.26],pR:[.07,.26],hipL:[-.03,.25],hipR:[.03,.25],
    kL:[.2,.26],kR:[.22,.27],aL:[.2,.035],aR:[.23,.035],eL:[.05,.39],hL:[.2,.43],eR:[.09,.4],hR:[.23,.44]},
  board:{hd:[.02,.47],nk:[.01,.39],sL:[-.075,.355],sR:[.09,.355],wL:[-.055,.17],wR:[.06,.17],pL:[-.065,.06],pR:[.065,.06],hipL:[-.03,.06],hipR:[.03,.06],
    kL:[.15,.18],kR:[.17,.19],aL:[.3,.04],aR:[.32,.04],eL:[.12,.38],hL:[.24,.44],eR:[.14,.4],hR:[.27,.47]}};
function person(x,y,h,o={}){
  const d=o.dir||1,J=Object.assign({},BASE,POSES[o.pose||'stand']),ow=Math.max(.45,Math.min(1.2,h*.0068));
  const X=p=>R1(x+d*p[0]*h),Y=p=>R1(y-p[1]*h),Q=(a,b)=>[a[0]+b[0],a[1]+b[1]];
  const ln=(a,b,w)=>({a,b,w:w*h}),sat=o.pose==='sit'||o.pose==='board';
  function sil(lines,polys,circs){let A='',B='';
    lines.forEach(l=>{const c=`x1="${X(l.a)}" y1="${Y(l.a)}" x2="${X(l.b)}" y2="${Y(l.b)}"`;A+=`<line class="bo" ${c} stroke-width="${R1(l.w+2*ow)}"/>`;B+=`<line class="bf" ${c} stroke-width="${R1(l.w)}"/>`});
    polys.forEach(p=>{const pts=p.map(q=>X(q)+','+Y(q)).join(' ');A+=`<polygon class="bo" points="${pts}" stroke-width="${R1(2*ow)}"/>`;B+=`<polygon class="bfp" points="${pts}"/>`});
    circs.forEach(c=>{A+=`<circle class="bo" cx="${X(c.p)}" cy="${Y(c.p)}" r="${R1(c.r*h+ow)}" stroke="none"/>`;B+=`<circle class="${c.k||'bfp'}" cx="${X(c.p)}" cy="${Y(c.p)}" r="${R1(c.r*h)}"/>`});
    return A+B}
  const shoe=a=>`<ellipse class="shoe" cx="${R1(x+d*(a[0]+.022)*h)}" cy="${R1(y-(a[1]-.012)*h)}" rx="${R1(.04*h)}" ry="${R1(.017*h)}"/>`;

  {x:792,y:199,n:'Height on leaving',m:['3.0 m (felt)','head at the door frame'],t:'Same girl, two hours later. Her head reaches the door frame: confident and ready for tomorrow.'}]}
];
function dimH(x1,x2,y,t){return `<line class="dim" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="dim" x1="${x1}" y1="${y-7}" x2="${x1}" y2="${y+7}"/><line class="dim" x1="${x2}" y1="${y-7}" x2="${x2}" y2="${y+7}"/><line class="dim" x1="${x1-4}" y1="${y+4}" x2="${x1+4}" y2="${y-4}"/><line class="dim" x1="${x2-4}" y1="${y+4}" x2="${x2+4}" y2="${y-4}"/><text class="dimt" x="${(x1+x2)/2}" y="${y-7}" text-anchor="middle">${t}</text>`}
function dimV(x,y1,y2,t,a='start'){return `<line class="dim" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line class="dim" x1="${x-7}" y1="${y1}" x2="${x+7}" y2="${y1}"/><line class="dim" x1="${x-7}" y1="${y2}" x2="${x+7}" y2="${y2}"/><text class="dimt" x="${a==='start'?x+10:x-10}" y="${(y1+y2)/2+4}" text-anchor="${a}">${t}</text>`}
function level(x,y,t){return `<path class="dim" d="M${x-6} ${y-11}h12l-6 11z"/><text class="dimt" x="${x+10}" y="${y-3}">${t}</text>`}

/* ---------- state ---------- */
const $=id=>document.getElementById(id),svg=$('svg'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,ZS=[2,3.5,5];
let cur=0,lx=500,ly=300,RL=95,Z=3.5,lensOn=true,dimsOn=false,active=-1;
const tabs=$('tabs');
SHEETS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.tab;b.setAttribute('aria-label',s.no+' '+s.title);b.onclick=()=>go(i);tabs.appendChild(b)});

function go(i,first){
  cur=(i+SHEETS.length)%SHEETS.length;const S=SHEETS[cur],art=$('art');
  art.innerHTML=S.art(S);$('dims').innerHTML=S.dims();
  if(!reduce&&!first){art.querySelectorAll('.s:not(.dash):not(.grid):not(.prop)').forEach(e=>e.setAttribute('pathLength','1'));
    art.classList.remove('drawin');void art.getBBox();art.classList.add('drawin');
    clearTimeout(go.t);go.t=setTimeout(()=>{art.classList.remove('drawin');art.querySelectorAll('[pathLength]').forEach(e=>e.removeAttribute('pathLength'))},1900);
    document.querySelectorAll('.strip .cell,.notes>div').forEach(e=>{e.classList.remove('fadein');void e.offsetWidth;e.classList.add('fadein')})}
  $('pins').innerHTML=S.details.map((d,k)=>`<g><circle class="pinhit" data-k="${k}" cx="${d.x}" cy="${d.y}" r="16"/><circle class="pin" data-k="${k}" cx="${d.x}" cy="${d.y}" r="7"/><line class="dim" x1="${d.x-11}" y1="${d.y}" x2="${d.x+11}" y2="${d.y}"/><line class="dim" x1="${d.x}" y1="${d.y-11}" x2="${d.x}" y2="${d.y+11}"/></g>`).join('');
  $('pins').querySelectorAll('.pinhit').forEach(p=>p.addEventListener('click',()=>{if(!lensOn)toggleLens();focusDetail(+p.dataset.k)}));
  $('micro').innerHTML=S.details.map((d,k)=>{const y0=d.y+12.5;return `<path class="dim" d="M${d.x+5} ${d.y+5}L${d.x+8} ${y0-3.4}"/>`+`<text class="tiny r" x="${d.x}" y="${y0}" text-anchor="middle">D${k+1}</text>`+d.m.map((l,j)=>`<text class="tiny" x="${d.x}" y="${R1(y0+4.3*(j+1))}" text-anchor="middle">${l}</text>`).join('')}).join('');
  $('ttl').textContent=S.no+' '+S.title+'. '+S.kind;
  [...tabs.children].forEach((b,k)=>b.setAttribute('aria-current',k===cur));
  $('count').textContent=S.no+'  ·  '+(cur===0?'cover':S.id+' / V');
  $('meta').textContent='Scale '+S.scale.replace(/ /g,'')+'  ·  '+S.lvl;
  $('caption').textContent=(cur===0?'':S.id+'. ')+S.title;$('lvl').textContent=S.lvl;$('time').textContent=S.time;
  $('dscale').textContent=S.scale;$('dtime').textContent=S.time;$('dno').textContent=S.no;$('dof').textContent=(cur+1)+' of '+SHEETS.length;
  $('bdl').innerHTML=S.details.map((d,k)=>`<li><button data-k="${k}"><b>D${k+1}</b>${d.n}</button></li>`).join('');
  $('bdl').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!lensOn)toggleLens();focusDetail(+b.dataset.k)});
  $('n1l').textContent=S.n1l;$('n2l').textContent=S.n2l;
  if(cur===0){
    $('n1').innerHTML='<p class="note" style="margin-bottom:14px">Teaching and learning as an art, told in five sheets. A teacher designs the room, but only students make it a place.</p><ul class="how"><li><b>∇ Level</b>: the student’s confidence above the datum.</li><li><b>Scale</b>: how closely each sheet looks.</li><li><b>⊕</b>: a detail.</li><li><b>↔</b>: a measurement that matters.</li></ul>';
    $('n2').innerHTML='<table class="idx"><tbody>'+SHEETS.slice(1).map((s,k)=>`<tr><td>${s.no}</td><td><button data-i="${k+1}">${s.id}. ${s.title}</button></td><td>${s.scale.replace(/ /g,'')}</td></tr>`).join('')+'</tbody></table>';
    $('n2').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  }else{$('n1').innerHTML='<p class="note"></p>';$('n1').firstChild.textContent=S.note;$('n2').innerHTML='<p class="kq"></p>';$('n2').firstChild.textContent=S.kq}
  try{history.replaceState(null,'','#'+S.id)}catch(e){}
  active=-9;focusDetail(cur===0?3:0,true)}

function placeLens(x,y){
  lx=Math.max(0,Math.min(1000,x));ly=Math.max(0,Math.min(620,y));
  $('lcc').setAttribute('cx',lx);$('lcc').setAttribute('cy',ly);$('lcc').setAttribute('r',RL);
  $('zoom').setAttribute('transform',`translate(${lx} ${ly}) scale(${Z}) translate(${-lx} ${-ly})`);
  $('ringg').setAttribute('transform',`translate(${R1(lx)} ${R1(ly)})`);$('ring').setAttribute('r',RL);$('halo').setAttribute('r',RL+2);
  let t='';for(let a=0;a<360;a+=10){const k=a%90===0?10:a%30===0?6:3,c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);t+=`M${R1(c*RL)} ${R1(s*RL)}L${R1(c*(RL-k))} ${R1(s*(RL-k))}`}
  $('ticks').setAttribute('d',t);$('cross').setAttribute('d','M-6 0H6M0 -6V6');
  const rt=$('ringt');rt.textContent=Z+'×';rt.setAttribute('x',R1(RL*.72+4));rt.setAttribute('y',R1(-RL*.72));
  const tag=$('tag');tag.setAttribute('y',ly+RL+16>612?-RL-9:RL+16);
  const S=SHEETS[cur];let best=-1,bd=1e9;S.details.forEach((d,k)=>{const q=Math.hypot(d.x-lx,d.y-ly);if(q<bd){bd=q;best=k}});
  setActive(bd<Math.max(18,RL/Z*1.4)?best:-1)}
function setActive(k){if(k===active)return;active=k;const S=SHEETS[cur];
  $('pins').querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',+p.dataset.k===k));
  $('bdl').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',+b.dataset.k===k));
  if(k<0){$('rk').textContent=S.no+'  ·  '+S.kind;$('rh').textContent=S.title;$('rp').textContent=S.details.length+' details on this sheet.';$('tag').textContent=''}
  else{const d=S.details[k];$('rk').textContent='DETAIL '+(k+1)+' / '+S.details.length+'  ·  '+S.no;$('rh').textContent=d.n;$('rp').textContent=d.t;$('tag').textContent='D'+(k+1)+' · '+d.n.toUpperCase()}}
function focusDetail(k,quiet){const d=SHEETS[cur].details[k];if(!d)return;
  if(quiet||reduce){placeLens(d.x,d.y);return}
  const sx=lx,sy=ly,t0=performance.now(),step=n=>{const u=Math.min(1,(n-t0)/450),e=u*u*(3-2*u);placeLens(sx+(d.x-sx)*e,sy+(d.y-sy)*e);if(u<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function sizeLens(){const w=svg.getBoundingClientRect().width||1000;RL=Math.max(70,Math.min(120,(w<600?54:108)*1000/w));placeLens(lx,ly)}
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function track(e){if(!lensOn)return;const q=toSvg(e);placeLens(q.x,q.y-(e.pointerType==='touch'?RL*.85:0))}
svg.addEventListener('pointermove',track);svg.addEventListener('pointerdown',track);
function toggleLens(){lensOn=!lensOn;$('bLens').setAttribute('aria-pressed',lensOn);$('lens').style.display=lensOn?'':'none';svg.classList.toggle('lensing',lensOn);active=-9;placeLens(lx,ly)}
$('bLens').onclick=toggleLens;svg.classList.add('lensing');
$('bZoom').onclick=()=>{Z=ZS[(ZS.indexOf(Z)+1)%ZS.length];$('bZoom').textContent=Z+'×';if(!lensOn)toggleLens();active=-9;placeLens(lx,ly)};
$('bDims').onclick=()=>{dimsOn=!dimsOn;$('bDims').setAttribute('aria-pressed',dimsOn);$('dims').hidden=!dimsOn};
$('bNext').onclick=()=>{if(!lensOn)toggleLens();focusDetail(((active<0?-1:active)+1)%SHEETS[cur].details.length)};
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
addEventListener('resize',sizeLens);
const h=(location.hash||'').slice(1).toLowerCase(),start=Math.max(0,SHEETS.findIndex(s=>s.id.toLowerCase()===h));
go(start,true);sizeLens();focusDetail(start===0?3:0,true);
</script>
